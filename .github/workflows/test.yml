name: Noir tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MINIMUM_NOIR_VERSION: 1.0.0-rc.3
  # The example contracts: keep in sync with `examples/.aztecrc`, the aztec-nr tag in every
  # examples/*/Nargo.toml and the README's compatibility section.
  AZTEC_VERSION: 6.0.0

jobs:
  # Formatting, generated and vendored files, and the oracle tests (CONTRIBUTING.md#tests), which need Node.js.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ env.MINIMUM_NOIR_VERSION }}

      - name: Run formatter
        run: |
          nargo --program-dir noir fmt --check
          nargo --program-dir tests/ethereum_oracle_tests fmt --check

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Install generator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts

      - name: Check generated files
        run: python3 scripts/generate.py --check

      - name: Check vendored libraries against upstream
        run: ./scripts/vendor.sh --check

      - name: Oracle tests
        timeout-minutes: 5
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/ethereum_oracle_tests
          tests/ethereum_oracle_tests/run.sh

  # One job per package and toolchain: the minimum supported Noir (1.0.0-rc.3, which Aztec 6.0.0 ships) and the
  # latest release; nightly-canary.yml covers Noir nightly. Each package runs in its per-pull-request mode
  # (CONTRIBUTING.md#tests) with four test threads, the vCPUs of a hosted runner.
  # ethereum_ssz has no tests of its own: ethereum_storage_proofs tests it.
  test:
    name: Test ${{ matrix.package }} on Nargo ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.0.0-rc.3, 1.0.0]
        package: [ethereum_types, ethereum_keccak, ethereum_proofs, ethereum_recursive_proofs, ethereum_storage_proofs]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Run tests
        run: nargo --program-dir noir test --force-brillig --inliner-aggressiveness 0 --package ${{ matrix.package }} --test-threads 4

  # The TypeScript SDK. Its tests use saved and mocked inputs only, so the job needs
  # no Noir toolchain, backend or network.
  host:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/ethereum-storage-proofs
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # The example contracts need the Aztec toolchain, which pins its own nargo. They are type-checked, not compiled:
  # their tests run the contracts' logic in TXE test contexts.
  examples:
    name: Test example contracts on Aztec 6.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Cache Aztec toolchain
        id: aztec-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aztec
          key: aztec-${{ env.AZTEC_VERSION }}-${{ runner.os }}

      - name: Install Aztec toolchain
        if: steps.aztec-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://install.aztec-labs.com | VERSION=${{ env.AZTEC_VERSION }} bash

      - name: Add Aztec toolchain to PATH
        run: |
          echo "$HOME/.aztec/current/bin" >> $GITHUB_PATH
          echo "$HOME/.aztec/bin" >> $GITHUB_PATH

      - name: Cache Nargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nargo
          key: nargo-${{ hashFiles('**/Nargo.toml') }}

      - name: Check formatting
        working-directory: examples
        run: aztec-nargo fmt --check

      - name: Type-check the example contracts
        working-directory: examples
        run: aztec-nargo check --workspace

      - name: Run the example tests (TXE)
        run: ./scripts/test-examples.sh --jobs 4

  # This is a job which depends on all test jobs and reports the overall status.
  # This allows us to add/remove test jobs without having to update the required workflows.
  tests-end:
    name: Noir End
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # We want this job to always run (even if the dependant jobs fail) as we want this job to fail rather than skipping.
    if: ${{ always() }}
    needs:
      - format
      - test
      - host
      - examples

    steps:
      - name: Report overall success
        run: |
          if [[ $FAIL == true ]]; then
              exit 1
          else
              exit 0
          fi
        env:
          # A failed or cancelled job fails the workflow; a skipped job does not.
          FAIL: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
